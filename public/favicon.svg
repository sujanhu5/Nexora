<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="ringGrad" x1="8" y1="20" x2="56" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#7dd3fc" />
      <stop offset="50%" stopColor="#ffffff" />
      <stop offset="100%" stopColor="#38bdf8" />
    </linearGradient>
    <linearGradient id="globeGrad" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#ffffff" />
      <stop offset="60%" stopColor="#7dd3fc" />
      <stop offset="100%" stopColor="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Background Space -->
  <rect width="64" height="64" rx="14" fill="#000000" />

  <!-- Back Ring -->
  <g transform="rotate(-21 32 32)">
    <path d="M 6 32 A 26 6.5 0 0 1 58 32" stroke="url(#ringGrad)" stroke-width="2.2" opacity="0.75" />
  </g>

  <!-- Wireframe Sphere -->
  <circle cx="32" cy="32" r="17" fill="#020617" stroke="url(#globeGrad)" stroke-width="1.4" />
  
  <!-- Latitude / Longitude lines -->
  <ellipse cx="32" cy="27" rx="15" ry="6" stroke="url(#globeGrad)" stroke-width="0.8" opacity="0.7" />
  <ellipse cx="32" cy="37" rx="15" ry="6" stroke="url(#globeGrad)" stroke-width="0.8" opacity="0.7" />
  <ellipse cx="32" cy="32" rx="7" ry="17" stroke="url(#globeGrad)" stroke-width="0.8" opacity="0.7" />

  <!-- Star Nodes -->
  <circle cx="32" cy="15" r="1.2" fill="#ffffff" />
  <circle cx="32" cy="49" r="1.2" fill="#ffffff" />
  <circle cx="18" cy="28" r="1.2" fill="#bae6fd" />
  <circle cx="46" cy="28" r="1.2" fill="#bae6fd" />
  <circle cx="21" cy="38" r="1.2" fill="#bae6fd" />
  <circle cx="43" cy="38" r="1.2" fill="#bae6fd" />
  <circle cx="32" cy="32" r="1.5" fill="#ffffff" />

  <!-- Front Ring -->
  <g transform="rotate(-21 32 32)">
    <path d="M 58 32 A 26 6.5 0 0 1 6 32" stroke="url(#ringGrad)" stroke-width="2.6" stroke-linecap="round" />
    <circle cx="6" cy="32" r="1.4" fill="#ffffff" />
    <circle cx="58" cy="32" r="1.4" fill="#ffffff" />
  </g>
</svg>
